<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLYFORM</title>
<meta name="description" content="CLYFORM.">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#141414; --mut:#5c5c5c; --line:#e3e3e3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f0f; --fg:#ededed; --mut:#9a9a9a; --line:#272727; }
  }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); margin:0;
         font:16px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         display:flex; min-height:100vh; }
  main { max-width:34rem; margin:auto; padding:3rem 1rem; }
  h1 { font-size:1.4rem; font-weight:600; letter-spacing:.22em; margin:0 0 1.2rem; }
  p { color:var(--mut); margin:0 0 2rem; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  a { display:block; padding:.9rem .2rem; color:inherit; text-decoration:none; }
  a:hover { opacity:.65; }
  .t { font-size:.82rem; color:var(--mut); }
</style>
</head>
<body>
<main>
  <h1>CLYFORM</h1>
  <ul>
    <li>
      <a href="./youtube-sync/">CLYFORM channel sync</a>
    </li>
  </ul>
</main>
</body>
</html>
